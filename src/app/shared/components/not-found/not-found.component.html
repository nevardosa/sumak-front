<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full text-center">
    <!-- 404 Illustration -->
    <div class="mb-8">
      <div class="mx-auto w-32 h-32 bg-primary-100 rounded-full flex items-center justify-center mb-6">
        <svg class="w-16 h-16 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
      </div>
      
      <h1 class="text-6xl font-bold text-gray-900 mb-4">404</h1>
      <h2 class="text-2xl font-semibold text-gray-700 mb-2">
        Página no encontrada
      </h2>
      <p class="text-gray-600 mb-8">
        Lo sentimos, la página que buscas no existe o ha sido movida.
      </p>
    </div>

    <!-- Actions -->
    <div class="space-y-4">
      <app-button
        variant="primary"
        size="lg"
        [fullWidth]="true"
        routerLink="/"
      >
        Volver al Inicio
      </app-button>
      
      <app-button
        variant="outline"
        size="lg"
        [fullWidth]="true"
        (clicked)="goBack()"
      >
        Página Anterior
      </app-button>
    </div>

    <!-- Help Links -->
    <div class="mt-8 pt-8 border-t border-gray-200">
      <p class="text-sm text-gray-500 mb-4">
        ¿Necesitas ayuda? Prueba estos enlaces:
      </p>
      <div class="flex justify-center space-x-6">
        <a
          routerLink="/dashboard"
          class="text-sm text-primary-600 hover:text-primary-500 transition-colors"
        >
          Dashboard
        </a>
        <a
          href="#"
          class="text-sm text-primary-600 hover:text-primary-500 transition-colors"
        >
          Soporte
        </a>
        <a
          href="#"
          class="text-sm text-primary-600 hover:text-primary-500 transition-colors"
        >
          Contacto
        </a>
      </div>
    </div>
  </div>
</div>
