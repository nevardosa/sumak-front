<div class="fixed inset-0 z-50 flex justify-end bg-black/50" (click)="onBackdropClick($event)">
  <div class="bg-white w-full max-w-md h-full overflow-y-auto">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-100">
      <h2 class="text-xl font-medium text-sumak-green">Carrito de Compras</h2>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Cart Items -->
    <div class="flex-1 p-6">
      <div *ngIf="cartService.cart().items.length === 0" class="text-center py-12">
        <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.5 5M7 13l2.5 5m0 0h8m-8 0a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4z"></path>
        </svg>
        <p class="text-gray-500">Tu carrito está vacío</p>
      </div>

      <div *ngFor="let item of cartService.cart().items" class="flex items-center gap-4 py-4 border-b border-gray-100 last:border-b-0">
        <img [src]="item.product.imageUrl" [alt]="item.product.name" class="w-16 h-16 object-cover rounded-lg">

        <div class="flex-1">
          <h3 class="font-medium text-sumak-green text-sm">{{ item.product.name }}</h3>
          <p class="text-sumak-brown font-semibold">{{ formatPrice(item.product.price) }}</p>

          <!-- Quantity Controls -->
          <div class="flex items-center gap-2 mt-2">
            <button
              (click)="updateQuantity(item.product.id, item.quantity - 1)"
              [disabled]="item.quantity <= 1"
              class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-sm hover:bg-gray-50 disabled:opacity-50"
            >
              -
            </button>
            <span class="w-8 text-center text-sm">{{ item.quantity }}</span>
            <button
              (click)="updateQuantity(item.product.id, item.quantity + 1)"
              class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-sm hover:bg-gray-50"
            >
              +
            </button>
            <button
              (click)="removeItem(item.product.id)"
              class="ml-2 text-red-500 hover:text-red-700 text-sm"
            >
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer with Total -->
    <div *ngIf="cartService.cart().items.length > 0" class="border-t border-gray-100 p-6">
      <div class="flex justify-between items-center mb-4">
        <span class="text-lg font-medium text-sumak-green">Total:</span>
        <span class="text-xl font-semibold text-sumak-brown">{{ formatPrice(cartService.cart().total) }}</span>
      </div>

      <app-button variant="primary" size="md" class="w-full" (clicked)="onCheckout()">
        Proceder al pago
      </app-button>
    </div>
  </div>
</div>

<!-- Checkout Modal -->
<app-checkout-modal 
  *ngIf="showCheckoutModal()" 
  (close)="onCloseCheckoutModal()">
</app-checkout-modal>
