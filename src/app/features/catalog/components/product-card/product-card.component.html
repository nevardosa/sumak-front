<article class="ritual-card" (click)="onDiscoverRitual()">
  <div class="ritual-image-wrapper">
    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      class="ritual-image"
      loading="lazy"
    />
  </div>
  
  <div class="ritual-content">
    <h3 class="ritual-name">{{ product.name }}</h3>
    <button type="button" class="ritual-action" (click)="onDiscoverRitual()">
      <span>Descubrir Ritual</span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M4 10h12m0 0l-4-4m4 4l-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</article>
