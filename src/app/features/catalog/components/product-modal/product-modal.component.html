<div class="luxury-modal-backdrop" (click)="onBackdropClick($event)">
  <div class="luxury-modal" (click)="$event.stopPropagation()">

    <!-- Botón Cerrar Ultra Sutil -->
    <button
      (click)="onClose()"
      class="luxury-close"
      aria-label="Cerrar"
      type="button">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Hero Image Protagonista -->
    <div class="luxury-hero" (click)="onImageClick()">
      <img [src]="product.imageUrl" [alt]="product.name" />
    </div>

    <!-- Contenido Editorial -->
    <div class="luxury-content">

      <!-- Título Hero -->
      <h1 class="luxury-title">{{ product.name }}</h1>

      <!-- Frase Sensorial -->
      <p class="luxury-sensorial">{{ product.sensorialExperience }}</p>

      <!-- Bloque El Ritual (Corazón Emocional) -->
      <div class="luxury-ritual">
        <h2 class="ritual-label">El Ritual</h2>
        <p class="ritual-text">{{ product.experience }}</p>
      </div>

      <!-- Información Detallada -->
      <div class="luxury-details">

        <div class="detail-block">
          <h3 class="detail-label">Descripción</h3>
          <p class="detail-text">{{ product.description }}</p>
        </div>

        <div class="detail-block">
          <h3 class="detail-label">Ingredientes</h3>
          <ul class="detail-list">
            <li *ngFor="let ingredient of product.ingredients">{{ ingredient }}</li>
          </ul>
        </div>

        <div class="detail-block">
          <h3 class="detail-label">Línea Curada</h3>
          <p class="detail-text">{{ product.curatedLine }}</p>
        </div>

        <div class="detail-block">
          <h3 class="detail-label">Sugerencia de Servicio</h3>
          <p class="detail-text">{{ product.servingSuggestion }}</p>
        </div>

      </div>

      <!-- Precio Premium -->
      <div class="luxury-price">
        <p>{{ formatPrice(product.price) }}</p>
      </div>

      <!-- CTA Premium -->
      <button (click)="onAddToCart()" class="luxury-cta">
        <span>Agregar al carrito</span>
      </button>

    </div>
  </div>
</div>

<!-- Zoom Modal -->
<div *ngIf="showImageZoom" class="zoom-backdrop" (click)="onCloseImageZoom()">
  <img [src]="product.imageUrl" [alt]="product.name" />
  <button (click)="onCloseImageZoom()" class="zoom-close" aria-label="Cerrar zoom">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
</div>
