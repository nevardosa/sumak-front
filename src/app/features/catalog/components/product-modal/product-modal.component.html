<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" (click)="onBackdropClick($event)">
  <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-100">
      <h2 class="text-2xl font-normal text-sumak-green">{{ product.name }}</h2>
      <button (click)="onClose()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6">
      <!-- Image and Price -->
      <div class="grid md:grid-cols-2 gap-6 mb-6">
        <div class="relative cursor-zoom-in" (click)="onImageClick()">
          <img [src]="product.imageUrl" [alt]="product.name" class="w-full aspect-square object-cover rounded-lg hover:opacity-90 transition-opacity">
          <div class="absolute inset-0 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity bg-black/20 rounded-lg">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
            </svg>
          </div>
        </div>
        <div>
          <p class="text-3xl font-semibold text-sumak-brown mb-4">{{ formatPrice(product.price) }}</p>
          <p class="text-text-body mb-4">{{ product.description }}</p>
          <div class="mb-4">
            <h4 class="font-medium text-sumak-green mb-2">Experiencia</h4>
            <p class="text-sm text-text-secondary italic">{{ product.experience }}</p>
          </div>
        </div>
      </div>

      <!-- Sensorial Experience -->
      <div class="mb-6">
        <h4 class="font-medium text-sumak-green mb-2">Experiencia Sensorial</h4>
        <p class="text-text-secondary">{{ product.sensorialExperience }}</p>
      </div>

      <!-- Ingredients -->
      <div class="mb-6">
        <h4 class="font-medium text-sumak-green mb-3">Ingredientes</h4>
        <ul class="space-y-2">
          <li *ngFor="let ingredient of product.ingredients" class="flex items-start">
            <span class="w-2 h-2 bg-sumak-gold rounded-full mt-2 mr-3 flex-shrink-0"></span>
            <span class="text-sm text-text-body">{{ ingredient }}</span>
          </li>
        </ul>
      </div>

      <!-- Actions -->
      <div class="flex gap-3">
        <app-button variant="outline" size="md" class="flex-1" (clicked)="onClose()">
          Cerrar
        </app-button>
        <app-button variant="primary" size="md" class="flex-1" (clicked)="onAddToCart()">
          Agregar al Carrito
        </app-button>
      </div>
    </div>
  </div>
</div>

<!-- Image Zoom Modal -->
<div *ngIf="showImageZoom" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90" (click)="onCloseImageZoom()">
  <div class="relative max-w-4xl max-h-full">
    <img [src]="product.imageUrl" [alt]="product.name" class="max-w-full max-h-full object-contain">
    <button (click)="onCloseImageZoom()" class="absolute top-4 right-4 text-white hover:text-gray-300">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
</div>
