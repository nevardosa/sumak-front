<div class="min-h-screen bg-gray-50">
  <!-- Header del Catálogo -->
  <div class="bg-white">
    <div class="container-sumak py-20">
      <div class="text-center max-w-4xl mx-auto">
        <h1 class="text-5xl lg:text-6xl font-against text-sumak-green mb-6 leading-tight tracking-tight">
          Colección de Rituales
        </h1>
        <p class="text-xl font-garet font-light text-text-secondary leading-relaxed">
          Experiencias gastronómicas cuidadosamente curadas para momentos que merecen ser recordados.
        </p>
      </div>
    </div>
  </div>

  <!-- Grid de Rituales -->
  <div class="container-sumak py-20">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-12 lg:gap-16">
      <app-product-card
        *ngFor="let product of filteredProducts; trackBy: trackByProductId"
        [product]="product"
        (productClick)="onProductClick($event)"
      ></app-product-card>
    </div>

    <!-- Estado vacío -->
    <div *ngIf="filteredProducts.length === 0" class="text-center py-24">
      <h3 class="text-2xl font-against text-sumak-green mb-4">No hay rituales disponibles</h3>
      <p class="text-lg font-garet font-light text-text-body">Explora nuestra colección completa</p>
    </div>
  </div>

  <!-- Botón flotante del carrito LUXURY -->
  <button
    *ngIf="cartService.cart().itemCount > 0"
    (click)="toggleCart()"
    [class.cart-shake]="cartShake()"
    class="luxury-cart-fab"
    aria-label="Ver carrito"
    type="button"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.5 5M7 13l2.5 5m0 0h8m-8 0a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4z"></path>
    </svg>
    <span class="luxury-cart-badge">
      {{ cartService.cart().itemCount }}
    </span>
  </button>
</div>

<!-- Modal del Producto -->
<app-product-modal
  *ngIf="showProductModal && selectedProduct"
  [product]="selectedProduct"
  (close)="onCloseModal()"
  (addToCart)="onAddToCart($event)"
></app-product-modal>

<!-- Carrito de Compras -->
<app-cart
  *ngIf="showCart"
  (close)="toggleCart()"
></app-cart>

<!-- Toast Notification -->
<app-toast
  [show]="showToast()"
  [title]="toastTitle()"
  [message]="toastMessage()"
  [autoClose]="true"
  [duration]="3000"
  (closed)="onToastClosed()">
</app-toast>
