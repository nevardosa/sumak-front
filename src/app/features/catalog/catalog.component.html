<div class="catalog-section">
  <!-- Header -->
  <div class="catalog-section__header">
    <div class="catalog-section__header-inner">
      <h1 class="catalog-section__title">
        Colección de Rituales
      </h1>
      <p class="catalog-section__description">
        Experiencias gastronómicas cuidadosamente curadas para momentos que merecen ser recordados.
      </p>
    </div>
  </div>

  <!-- Grid -->
  <div class="catalog-section__content">
    <div class="ritual-grid">
      <app-product-card
        *ngFor="let product of filteredProducts; trackBy: trackByProductId"
        [product]="product"
        (productClick)="onProductClick($event)"
      ></app-product-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredProducts.length === 0" class="catalog-section__empty">
      <h3 class="catalog-section__empty-title">No hay rituales disponibles</h3>
      <p class="catalog-section__empty-text">Explora nuestra colección completa</p>
    </div>
  </div>

  <!-- Cart FAB -->
  <button
    *ngIf="cartService.cart().itemCount > 0"
    (click)="toggleCart()"
    [class.cart-shake]="cartShake()"
    class="luxury-cart-fab"
    aria-label="Ver carrito"
    type="button"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.5 5M7 13l2.5 5m0 0h8m-8 0a2 2 0 100 4 2 2 0 000-4zm8 0a2 2 0 100 4 2 2 0 000-4z"></path>
    </svg>
    <span class="luxury-cart-badge">
      {{ cartService.cart().itemCount }}
    </span>
  </button>
</div>

<!-- Modal del Producto -->
<app-product-modal
  *ngIf="showProductModal && selectedProduct"
  [product]="selectedProduct"
  [ctaButtonAdded]="ctaButtonAdded()"
  (close)="onCloseModal()"
  (addToCart)="onAddToCart($event)"
></app-product-modal>

<!-- Mini Cart Drawer -->
<app-mini-cart-drawer
  *ngIf="showMiniCart() && miniCartProduct()"
  [product]="miniCartProduct()!"
  [subtotal]="miniCartSubtotal()"
  (close)="onCloseMiniCart()"
  (viewCart)="onMiniCartViewCart()"
  (checkout)="onMiniCartCheckout()"
></app-mini-cart-drawer>

<!-- Carrito de Compras -->
<app-cart
  *ngIf="showCart"
  (close)="toggleCart()"
  (checkout)="openCheckoutModal()"
></app-cart>

<!-- Checkout Modal -->
<app-checkout-modal
  *ngIf="showCheckoutModal()"
  (close)="onCloseCheckoutModal()"
></app-checkout-modal>

<!-- Toast Notification -->
<app-toast
  [show]="showToast()"
  [title]="toastTitle()"
  [message]="toastMessage()"
  [autoClose]="true"
  [duration]="3000"
  (closed)="onToastClosed()">
</app-toast>
