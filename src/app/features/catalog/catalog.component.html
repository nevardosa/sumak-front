<div class="catalog-section">
  <!-- Header -->
  <div class="catalog-section__header">
    <div class="catalog-section__header-inner">
      <h1 class="catalog-section__title">
        Colección de Rituales
      </h1>
      <p class="catalog-section__description">
        Experiencias gastronómicas cuidadosamente curadas para momentos que merecen ser recordados.
      </p>
    </div>
  </div>

  <!-- Grid -->
  <div class="catalog-section__content">
    <div class="ritual-grid">
      <app-product-card
        *ngFor="let product of filteredProducts; trackBy: trackByProductId"
        [product]="product"
        (productClick)="onProductClick($event)"
      ></app-product-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredProducts.length === 0" class="catalog-section__empty">
      <h3 class="catalog-section__empty-title">No hay rituales disponibles</h3>
      <p class="catalog-section__empty-text">Explora nuestra colección completa</p>
    </div>
  </div>

  <!-- Custom Concierge Section - After Products -->
  <app-custom-concierge-section
    (requestCustomRitual)="openCustomRitualContact()"
  ></app-custom-concierge-section>
</div>

<!-- Mini Cart Drawer -->
<app-mini-cart-drawer
  *ngIf="showMiniCart() && miniCartProduct()"
  [product]="miniCartProduct()!"
  (close)="onCloseMiniCart()"
  (viewCart)="onMiniCartViewCart()"
  (checkout)="onMiniCartCheckout()"
></app-mini-cart-drawer>

<!-- Toast Notification -->
<app-toast
  [show]="showToast()"
  [title]="toastTitle()"
  [message]="toastMessage()"
  [autoClose]="true"
  [duration]="3000"
  (closed)="onToastClosed()">
</app-toast>
