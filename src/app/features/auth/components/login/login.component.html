<div class="min-h-screen bg-gradient-to-br from-sumak-green via-sumak-green/95 to-sumak-brown flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center space-x-3 mb-4">
        <div class="w-12 h-12 bg-sumak-gold rounded-lg flex items-center justify-center">
          <span class="text-sumak-green font-angainc text-xl font-bold">S</span>
        </div>
        <div class="flex flex-col">
          <span class="font-angainc text-2xl font-normal text-white">Sumak</span>
          <span class="font-garet text-sm text-sumak-gold tracking-wider">GOURMET</span>
        </div>
      </div>
      <h1 class="title-secondary text-white mb-2">Acceso Administrativo</h1>
      <p class="body-small text-gray-200">Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Login Form -->
    <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-8 border border-white/20">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-white mb-2">
            Usuario
          </label>
          <div class="relative">
            <input
              id="username"
              type="text"
              formControlName="username"
              (input)="onInputChange()"
              autocomplete="username"
              class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-sumak-gold focus:border-transparent transition-all"
              placeholder="Ingresa tu usuario">
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <svg class="h-5 w-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
          </div>
          <div *ngIf="usernameError" class="mt-1 text-sm text-red-300">
            {{ usernameError }}
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-white mb-2">
            Contraseña
          </label>
          <div class="relative">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              (input)="onInputChange()"
              autocomplete="current-password"
              class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-sumak-gold focus:border-transparent transition-all pr-12"
              placeholder="Ingresa tu contraseña">
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-300 hover:text-white transition-colors">
              <svg *ngIf="!showPassword()" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg *ngIf="showPassword()" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </svg>
            </button>
          </div>
          <div *ngIf="passwordError" class="mt-1 text-sm text-red-300">
            {{ passwordError }}
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage()" class="bg-red-500/20 border border-red-500/30 rounded-lg p-3">
          <div class="flex items-center">
            <svg class="h-5 w-5 text-red-300 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="text-sm text-red-300">{{ errorMessage() }}</span>
          </div>
        </div>

        <!-- Submit Button -->
        <app-button
          type="submit"
          variant="secondary"
          size="lg"
          [disabled]="loginForm.invalid || isLoading()"
          [loading]="isLoading()"
          [fullWidth]="true"
          class="w-full">
          <span *ngIf="!isLoading()">Iniciar Sesión</span>
          <span *ngIf="isLoading()">Verificando...</span>
        </app-button>
      </form>
    </div>

    <!-- Security Notice -->
    <div class="mt-6 text-center">
      <p class="body-small text-gray-300">
        Acceso restringido • Sistema protegido
      </p>
    </div>
  </div>
</div>
