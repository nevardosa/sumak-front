<header class="bg-white shadow-sm border-b border-gray-100">
  <div class="container-sumak">
    <div class="flex justify-between items-center h-20">
      <!-- Logo SUMAK -->
      <div class="flex items-center">
        <app-logo size="md" variant="default" linkTo="/"></app-logo>
      </div>

      <!-- Navigation -->
      <nav class="hidden md:flex flex-1 justify-center space-x-6">
        <a
          routerLink="/catalog"
          routerLinkActive="text-sumak-green border-sumak-gold"
          class="text-text-secondary hover:text-sumak-green px-4 py-2 text-sm font-garet font-medium border-b-2 border-transparent hover:border-sumak-gold/50 transition-all duration-200 relative group"
        >
          Rituales
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-sumak-gold group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
        <a
          routerLink="/regalos-corporativos"
          routerLinkActive="text-sumak-green border-sumak-gold"
          class="text-text-secondary hover:text-sumak-green px-4 py-2 text-sm font-garet font-medium border-b-2 border-transparent hover:border-sumak-gold/50 transition-all duration-200 relative group"
        >
          Regalos Corporativos
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-sumak-gold group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
                <a
          routerLink="/experiencias"
          routerLinkActive="text-sumak-green border-sumak-gold"
          class="text-text-secondary hover:text-sumak-green px-4 py-2 text-sm font-garet font-medium border-b-2 border-transparent hover:border-sumak-gold/50 transition-all duration-200 relative group"
        >
          Experiencias
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-sumak-gold group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
        <a
          routerLink="/about"
          routerLinkActive="text-sumak-green border-sumak-gold"
          class="text-text-secondary hover:text-sumak-green px-4 py-2 text-sm font-garet font-medium border-b-2 border-transparent hover:border-sumak-gold/50 transition-all duration-200 relative group"
        >
          Sobre Sumak
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-sumak-gold group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>
        <a
          routerLink="/contact"
          routerLinkActive="text-sumak-green border-sumak-gold"
          class="text-text-secondary hover:text-sumak-green px-4 py-2 text-sm font-garet font-medium border-b-2 border-transparent hover:border-sumak-gold/50 transition-all duration-200 relative group"
        >
          Contacto
          <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-sumak-gold group-hover:w-full transition-all duration-300 ease-out"></span>
        </a>

        <!-- Admin only navigation -->
        <ng-container *ngIf="authService.isAuthenticated()">
          <a
            routerLink="/dashboard"
            routerLinkActive="text-sumak-green border-sumak-gold"
            class="text-text-secondary hover:text-sumak-green px-4 py-2 text-sm font-garet font-medium border-b-2 border-transparent hover:border-sumak-gold/50 transition-all duration-200 relative group"
          >
            Dashboard
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-sumak-gold group-hover:w-full transition-all duration-300 ease-out"></span>
          </a>
          <a
            routerLink="/profile"
            routerLinkActive="text-sumak-green border-sumak-gold"
            class="text-text-secondary hover:text-sumak-green px-4 py-2 text-sm font-garet font-medium border-b-2 border-transparent hover:border-sumak-gold/50 transition-all duration-200 relative group"
          >
            Perfil
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-sumak-gold group-hover:w-full transition-all duration-300 ease-out"></span>
          </a>
        </ng-container>
      </nav>

      <!-- User Menu -->
      <div class="flex items-center space-x-6 ml-auto">
        <div *ngIf="authService.currentUser() as user" class="flex items-center space-x-4">
          <div class="hidden md:block text-right">
            <p class="font-garet text-sm font-medium text-sumak-green">
              {{ user.firstName }} {{ user.lastName }}
            </p>
            <p class="font-garet text-xs text-text-body">{{ user.email }}</p>
          </div>

          <div class="relative">
            <button
              (click)="toggleUserMenu()"
              class="flex items-center space-x-2 p-3 rounded-lg hover:bg-gray-50 transition-colors duration-200"
            >
              <div class="w-10 h-10 bg-sumak-gold/10 rounded-full flex items-center justify-center">
                <span class="text-sumak-green font-garet font-medium text-sm">
                  {{ user.firstName.charAt(0) }}{{ user.lastName.charAt(0) }}
                </span>
              </div>
              <svg class="w-4 h-4 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div
              *ngIf="showUserMenu"
              class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-gray-100 py-2 z-50"
            >
              <a
                routerLink="/profile"
                class="block px-4 py-3 font-garet text-sm text-text-body hover:bg-gray-50 hover:text-sumak-green transition-colors duration-200"
                (click)="closeUserMenu()"
              >
                Mi Perfil
              </a>
              <a
                routerLink="/settings"
                class="block px-4 py-3 font-garet text-sm text-text-body hover:bg-gray-50 hover:text-sumak-green transition-colors duration-200"
                (click)="closeUserMenu()"
              >
                Configuración
              </a>
              <hr class="my-2 border-gray-100">
              <button
                (click)="logout()"
                class="block w-full text-left px-4 py-3 font-garet text-sm text-sumak-wine hover:bg-red-50 transition-colors duration-200"
              >
                Cerrar Sesión
              </button>
            </div>
          </div>
        </div>

        <div class="hidden md:block">
          <app-button
            variant="primary"
            size="md"
            routerLink="/cotizacion-corporativa"
          >
            Solicitar propuesta
          </app-button>
        </div>

        <!-- User Icon for guests -->
        <a
          *ngIf="!authService.isAuthenticated()"
          routerLink="/auth/login"
          class="group relative p-2 rounded-full hover:bg-sumak-gold/5 transition-all duration-300 ease-out"
          aria-label="Iniciar sesión"
        >
          <svg
            class="w-5 h-5 text-text-secondary/60 group-hover:text-sumak-green transition-colors duration-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </a>
      </div>

      <!-- Mobile menu button -->
      <div class="lg:hidden">
        <button
          (click)="toggleMobileMenu()"
          class="p-2 rounded-lg text-text-secondary hover:text-sumak-green hover:bg-gray-50 transition-colors duration-200"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              *ngIf="!showMobileMenu"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
            <path
              *ngIf="showMobileMenu"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div *ngIf="showMobileMenu" class="lg:hidden border-t border-gray-100 py-4">
      <div class="space-y-2">
        <a
          routerLink="/catalog"
          routerLinkActive="bg-sumak-green/5 text-sumak-green"
          class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
          (click)="closeMobileMenu()"
        >
          Rituales
        </a>
        <a
          routerLink="/regalos-corporativos"
          routerLinkActive="bg-sumak-green/5 text-sumak-green"
          class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
          (click)="closeMobileMenu()"
        >
          Regalos Corporativos
        </a>
        <a
          routerLink="/experiencias"
          routerLinkActive="bg-sumak-green/5 text-sumak-green"
          class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
          (click)="closeMobileMenu()"
        >
          Experiencias
        </a>
        <a
          routerLink="/faq"
          routerLinkActive="bg-sumak-green/5 text-sumak-green"
          class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
          (click)="closeMobileMenu()"
        >
          FAQ
        </a>
        <a
          routerLink="/about"
          routerLinkActive="bg-sumak-green/5 text-sumak-green"
          class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
          (click)="closeMobileMenu()"
        >
          Conócenos
        </a>
        <a
          routerLink="/contact"
          routerLinkActive="bg-sumak-green/5 text-sumak-green"
          class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
          (click)="closeMobileMenu()"
        >
          Contacto
        </a>
        <!-- Admin only mobile navigation -->
        <ng-container *ngIf="authService.isAuthenticated()">
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-sumak-green/5 text-sumak-green"
            class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
            (click)="closeMobileMenu()"
          >
            Dashboard
          </a>
          <a
            routerLink="/profile"
            routerLinkActive="bg-sumak-green/5 text-sumak-green"
            class="block px-4 py-3 font-garet text-base font-medium text-text-secondary hover:bg-gray-50 hover:text-sumak-green rounded-lg transition-colors duration-200"
            (click)="closeMobileMenu()"
          >
            Perfil
          </a>
        </ng-container>
      </div>
    </div>
  </div>
</header>
